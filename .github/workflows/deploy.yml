name: Deploy a InfinityFree

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: Subir por FTP
    runs-on: ubuntu-latest
    env:
      # GitHub forzó Node 24 para las acciones, lo que rompe la conexión
      # FTPS con el servidor de InfinityFree (error SSL en el canal de
      # datos). Esto mantiene Node 20 mientras GitHub lo siga permitiendo.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Desplegar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/conexion.php
